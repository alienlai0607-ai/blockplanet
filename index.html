<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2822/2822306.png">
    <link rel="icon" sizes="192x192" href="https://cdn-icons-png.flaticon.com/512/2822/2822306.png">

    <title>時空遺跡探測儀 (FLL終極版)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Special+Elite&display=swap" rel="stylesheet">
    
    <style>
        /* ================= CSS 樣式區 ================= */
        :root {
            --parchment-light: rgba(253, 246, 227, 0.85); /* 半透明羊皮紙色 */
            --dirt-brown: #5a4632;
            --ancient-gold: #d4af37;
            --relic-red: #c0392b;
            --deep-blue: #2c3e50;
            --brass-border: #b58e46;
        }

        body {
            font-family: 'Special Elite', 'Courier New', monospace;
            color: var(--dirt-brown);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            
            /* === 背景圖片設定 === */
            background-color: #ffffff; 
            background-image: url('bg.jpg'); /* 讀取您的圖片 */
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center bottom; /* 對齊底部 */
            background-size: cover; /* 電腦版填滿 */
        }

        /* === 📱 手機版響應式修正 (關鍵！) === */
        @media (max-width: 768px) {
            body {
                /* 強制寬度 100%，高度自動，確保底部公仔不被切掉 */
                background-size: 100% auto;
                background-position: center bottom;
                background-color: #ffffff; 
            }
            
            /* 把操作面板往上推，留空間給背景圖的公仔 */
            .dashboard {
                margin-bottom: 40vh !important; 
            }
        }

        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.9); 
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid var(--brass-border);
            width: 85%;
            max-width: 450px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
        }

        h1 {
            font-family: 'Cinzel Decorative', cursive;
            margin: 0;
            font-size: 1.5rem;
            color: var(--dirt-brown);
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--brass-border);
            font-weight: bold;
        }

        /* 儀表板主體 */
        .dashboard {
            background: var(--parchment-light);
            border: 3px solid var(--brass-border);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            padding: 20px;
            width: 88%;
            max-width: 400px;
            text-align: center;
            position: relative;
            backdrop-filter: blur(5px); /* 毛玻璃特效 */
            z-index: 10;
            margin-bottom: 50px; /* 電腦版預設留白 */
        }

        /* 裝飾鉚釘 */
        .dashboard::before, .dashboard::after {
            content: "•";
            position: absolute;
            color: var(--brass-border);
            font-size: 1.5rem;
            line-height: 0;
            top: 10px;
        }
        .dashboard::before { left: 10px; }
        .dashboard::after { right: 10px; }

        .status-badge {
            display: inline-block;
            background: #fff;
            border: 2px dashed var(--brass-border);
            color: var(--dirt-brown);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .status-badge.active {
            border-style: solid;
            background: var(--ancient-gold);
            animation: pulse-gold 2s infinite;
        }

        /* 音效開關按鈕 */
        .sound-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.6);
            border: 2px solid var(--dirt-brown);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dirt-brown);
        }
        .sound-toggle.muted { opacity: 0.6; background: #ddd; }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .metric-box {
            background: rgba(255,255,255,0.7);
            padding: 8px;
            border-radius: 15px;
            border: 2px solid var(--brass-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .metric-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--dirt-brown);
        }
        
        .metric-label {
            font-size: 0.7rem;
            color: #888;
        }

        .message-box {
            min-height: 40px;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 10px 0;
            font-family: 'Cinzel Decorative', cursive;
            color: var(--dirt-brown);
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid rgba(90, 70, 50, 0.2);
            border-bottom: 1px solid rgba(90, 70, 50, 0.2);
            padding: 8px 0;
        }

        .progress-track {
            background: #443322;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--brass-border);
            position: relative;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--deep-blue), var(--ancient-gold), var(--relic-red));
            transition: width 0.3s ease-out;
            border-right: 2px solid #fff;
        }

        .btn-main {
            background: var(--dirt-brown);
            color: #fff;
            border: 2px solid var(--brass-border);
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Special Elite', cursive;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 0 #3a2c1f;
        }
        .btn-main:active { transform: translateY(3px); box-shadow: 0 1px 0 #3a2c1f; }
        .btn-stop { background: var(--relic-red); margin-top: 10px; box-shadow: 0 4px 0 #8a291f; }

        .calibration-area {
            margin-top: 15px;
            border: 1px dotted var(--dirt-brown);
            padding: 5px;
            border-radius: 8px;
            background: rgba(255,255,255,0.8);
            font-size: 0.7rem;
        }
        .cal-btn-group { display: flex; gap: 5px; margin-top: 5px; }
        .btn-cal { background: var(--deep-blue); color: white; border: none; padding: 6px; border-radius: 4px; font-size: 0.7rem; flex: 1; }

        #log {
            background: rgba(255,255,255,0.9);
            color: var(--dirt-brown);
            font-size: 0.7rem;
            padding: 10px;
            width: 88%;
            max-width: 400px;
            height: 60px;
            overflow-y: auto;
            border: 2px dashed var(--brass-border);
            margin-top: 15px;
            text-align: left;
            border-radius: 5px;
            display: block; /* 手機版顯示 */
        }
