<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2822/2822306.png">
    <link rel="icon" sizes="192x192" href="https://cdn-icons-png.flaticon.com/512/2822/2822306.png">

    <title>時空遺跡探測儀 (抗縮放版)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Special+Elite&display=swap" rel="stylesheet">
    
    <style>
        /* ================= CSS 修正區 ================= */
        :root {
            --parchment-light: rgba(253, 246, 227, 0.9); /* 稍微不透明一點，增加閱讀性 */
            --dirt-brown: #5a4632;
            --ancient-gold: #d4af37;
            --relic-red: #c0392b;
            --deep-blue: #2c3e50;
            --brass-border: #b58e46;
        }

        html {
            height: 100%;
        }

        body {
            font-family: 'Special Elite', 'Courier New', monospace;
            color: var(--dirt-brown);
            margin: 0;
            padding: 0;
            
            /* === 版面配置核心修正 === */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* 從上面開始排，不要硬置中 */
            
            min-height: 100vh; /* 最小高度為螢幕高度 */
            
            /* === 背景圖片設定 (抗跑版關鍵) === */
            background-color: #ffffff; 
            background-image: url('bg.jpg'); 
            background-repeat: no-repeat;
            
            /* 讓背景圖永遠固定在視窗底部，不會跟著捲動跑掉 */
            background-attachment: fixed; 
            background-position: center bottom;
            
            /* 讓圖片寬度剛好，高度自動 */
            background-size: 100% auto; 
            
            /* === 關鍵：底部安全氣囊 === */
            /* 這裡預留 40% 的螢幕高度給背景圖的公仔 */
            /* 如果網頁放大，內容會往上長或出現捲軸，不會蓋到這裡 */
            padding-bottom: 40vh; 
            box-sizing: border-box; 
        }

        /* 電腦版時，背景圖可以用 cover 填滿 */
        @media (min-width: 769px) {
            body {
                background-size: cover; 
                padding-bottom: 100px; /* 電腦版留白少一點 */
            }
        }

        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.95); 
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid var(--brass-border);
            width: 85%;
            max-width: 450px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
            flex-shrink: 0; /* 禁止壓縮標題 */
        }

        h1 {
            font-family: 'Cinzel Decorative', cursive;
            margin: 0;
            font-size: 1.4rem;
            color: var(--dirt-brown);
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--brass-border);
            font-weight: bold;
        }

        .dashboard {
            background: var(--parchment-light);
            border: 3px solid var(--brass-border);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            padding: 15px;
            width: 88%;
            max-width: 400px;
            text-align: center;
            position: relative;
            backdrop-filter: blur(5px);
            z-index: 10;
            
            /* 移除原本的 margin-bottom Hack */
            margin-bottom: 20px; 
            flex-shrink: 0; /* 禁止壓縮儀表板 */
        }

        /* 裝飾鉚釘 */
        .dashboard::before, .dashboard::after {
            content: "•";
            position: absolute;
            color: var(--brass-border);
            font-size: 1.5rem;
            line-height: 0;
            top: 10px;
        }
        .dashboard::before { left: 10px; }
        .dashboard::after { right: 10px; }

        .status-badge {
            display: inline-block;
            background: #fff;
            border: 2px dashed var(--brass-border);
            color: var(--dirt-brown);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .status-badge.active {
            border-style: solid;
            background: var(--ancient-gold);
            animation: pulse-gold 2s infinite;
        }

        .sound-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.6);
            border: 2px solid var(--dirt-brown);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dirt-brown);
        }
        .sound-toggle.muted { opacity: 0.6; background: #ddd; }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .metric-box {
            background: rgba(255,255,255,0.7);
            padding: 8px;
            border-radius: 15px;
            border: 2px solid var(--brass-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .metric-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--dirt-brown);
        }
        
        .metric-label {
            font-size: 0.7rem;
            color: #888;
        }

        .message-box {
            min-height: 40px;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 10px 0;
            font-family: 'Cinzel Decorative', cursive;
            color: var(--dirt-brown);
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid rgba(90, 70, 50, 0.2);
            border-bottom: 1px solid rgba(90, 70, 50, 0.2);
            padding: 8px 0;
        }

        .progress-track {
            background: #443322;
            height: 18px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--brass-border);
            position: relative;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--deep-blue), var(--ancient-gold), var(--relic-red));
            transition: width 0.3s ease-out;
            border-right: 2px solid #fff;
        }

        .btn-main {
            background: var(--dirt-brown);
            color: #fff;
            border: 2px solid var(--brass-border);
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Special Elite', cursive;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 0 #3a2c1f;
        }
        .btn-main:active { transform: translateY(3px); box-shadow: 0 1px 0 #3a2c1f; }
        .btn-stop { background: var(--relic-red); margin-top: 10px; box-shadow: 0 4px 0 #8a291f; }

        .calibration-area {
            margin-top: 15px;
            border: 1px dotted var(--dirt-brown);
            padding: 5px;
            border-radius: 8px;
            background: rgba(255,255,255,0.8);
            font-size: 0.7rem;
            /* 讓校正區在需要時可以捲動，但不影響整體 */
            width: 88%; 
            max-width: 400px;
            flex-shrink: 0;
        }
        .cal-btn-group { display: flex; gap: 5px; margin-top: 5px; }
        .btn-cal { background: var(--deep-blue); color: white; border: none; padding: 6px; border-radius: 4px; font-size: 0.7rem; flex: 1; }

        #log {
            background: rgba(255,255,255,0.9);
            color: var(--dirt-brown);
            font-size: 0.7rem;
            padding: 10px;
            width: 88%;
            max-width: 400px;
            height: 60px;
            overflow-y: auto;
            border: 2px dashed var(--brass-border);
            margin-top: 15px;
            text-align: left;
            border-radius: 5px;
            display: block;
            flex-shrink: 0;
        }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<header>
    <h1>時空遺跡探測儀</h1>
    <div class="subtitle">FLL Challenge 特別版</div>
</header>

<div class="dashboard">
    <button id="btnSound" class="sound-toggle" title="切換音效">🔊</button>
    <div id="statusBadge" class="status-badge">儀器準備就緒</div>

    <div class="metrics-grid">
        <div class="metric-box">
            <div class="metric-label">訊號 RSSI</div>
            <div class="metric-value" id="rssiValue">---</div>
        </div>
        <div class="metric-box">
            <div class="metric-label">共鳴深度</div>
            <div style="display:flex; align-items:baseline;">
                <div class="metric-value" id="heatValue">0</div>
                <span style="font-size:1rem;">%</span>
            </div>
        </div>
    </div>

    <div class="message-box" id="mainFeedback">等待啟動...</div>

    <div class="heat-container">
        <div class="progress-track">
            <div class="progress-fill" id="heatBar"></div>
        </div>
    </div>

    <div id="controls">
        <button id="btnStart" class="btn-main">啟動探測器</button>
        <button id="btnStop" class="btn-main btn-stop hidden">中斷任務</button>
        <button id="btnRescan" class="btn-main btn-stop hidden">重新校準</button>
    </div>
</div>

<div class="calibration-area">
    <div style="font-weight:bold;">🔧 工程校正 (Calibration)</div>
    <div class="cal-btn-group">
        <button class="btn-cal" onclick="setCloseLimit()">設為最近 (Hot)</button>
        <button class="btn-cal" onclick="setFarLimit()">設為最遠 (Cold)</button>
    </div>
</div>

<div id="log">> 系統初始化完成。<br>> 請點擊啟動並選取 micro:bit。</div>

<script>
    // === 1. 設定與參數 ===
    const CONFIG = {
        RSSI_COLD: -95,         
        RSSI_HOT: -50,          
        SMOOTHING_FACTOR: 0.1,  
        LOST_TIMEOUT: 3000      
    };

    let bluetoothDevice;
    let smoothedRssi = -100;
    let currentHeat = 0;
    let watchdogTimer;
    let isScanning = false;

    // === 2. 音效系統 ===
    const AudioEngine = {
        ctx: null, isMuted: false, timerId: null,
        init: function() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!this.ctx) { this.ctx = new AudioContext(); }
            if (this.ctx.state === 'suspended') { this.ctx.resume(); }
            this.startScheduler();
        },
        playBeep: function(freq, duration) {
            if (this.isMuted || !this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine'; osc.frequency.value = freq;
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start();
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
            osc.stop(this.ctx.currentTime + duration);
        },
        toggleMute: function() {
            this.isMuted = !this.isMuted;
            const btn = document.getElementById('btnSound');
            if(this.isMuted) {
                btn.classList.add('muted'); btn.innerText = '🔇';
            } else {
                btn.classList.remove('muted'); btn.innerText = '🔊';
                if(this.ctx) this.playBeep(600, 0.1); 
            }
        },
        startScheduler: function() {
            const schedule = () => {
                if (isScanning && currentHeat > 0) {
                    const pitch = 400 + (currentHeat * 8); 
                    let interval = 1200 - (currentHeat * 11);
                    interval = Math.max(80, interval); 
                    this.playBeep(pitch, 0.1);
                    this.timerId = setTimeout(schedule, interval);
                } else {
                    this.timerId = setTimeout(schedule, 500);
                }
            };
            schedule();
        },
        stop: function() { if(this.timerId) clearTimeout(this.timerId); }
    };

    // === 3. UI 元素綁定 ===
    const ui = {
        badge: document.getElementById('statusBadge'),
        feedback: document.getElementById('mainFeedback'),
        rssi: document.getElementById('rssiValue'),
        heatVal: document.getElementById('heatValue'),
        heatBar: document.getElementById('heatBar'),
        btnStart: document.getElementById('btnStart'),
        btnStop: document.getElementById('btnStop'),
        btnRescan: document.getElementById('btnRescan'),
        log: document.getElementById('log')
    };

    // === 4. 藍牙核心邏輯 ===
    async function startScan() {
        AudioEngine.init();
        if (!navigator.bluetooth) {
            alert("⚠️ 錯誤：不支援 Web Bluetooth。\n請使用 Android Chrome 或 iOS Bluefy。");
            return;
        }
        try {
            updateStatus("啟動音效與掃描...", true);
            log("> 系統啟動...");
            
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: "BBC micro:bit" }], 
                optionalServices: [] 
            });

            const deviceName = bluetoothDevice.name || "未知目標";
            log(`> 鎖定目標：${deviceName}`);
            updateStatus("訊號鎖定", true);
            
            bluetoothDevice.addEventListener('advertisementreceived', handleAdvertisement);
            await bluetoothDevice.watchAdvertisements();
            
            isScanning = true;
            toggleButtons(true);
            smoothedRssi = -100; 
        } catch (error) {
            if (error.name === 'NotFoundError') { updateStatus("操作取消", false); } 
            else { 
                updateStatus("連線錯誤", false);
                log(`> 錯誤：${error.message}`);
                if(error.message.includes("watchAdvertisements")) alert("請確認已開啟 Chrome 實驗功能。");
            }
        }
    }

    function handleAdvertisement(event) {
        const rawRssi = event.rssi;
        if (smoothedRssi === -100) { smoothedRssi = rawRssi; } 
        else { smoothedRssi = (CONFIG.SMOOTHING_FACTOR * rawRssi) + ((1 - CONFIG.SMOOTHING_FACTOR) * smoothedRssi); }
        updateUI(rawRssi, smoothedRssi);
        resetWatchdog();
    }

    function updateUI(raw, smooth) {
        let clamped = Math.max(CONFIG.RSSI_COLD, Math.min(smooth, CONFIG.RSSI_HOT));
        let heatPercent = ((clamped - CONFIG.RSSI_COLD) / (CONFIG.RSSI_HOT - CONFIG.RSSI_COLD)) * 100;
        currentHeat = Math.round(heatPercent);

        ui.rssi.innerText = Math.round(smooth); 
        ui.heatVal.innerText = currentHeat;
        ui.heatBar.style.width = `${currentHeat}%`;

        let text = "", color = "";
        if (currentHeat < 30) { text = "❄️ 訊號微弱"; color = "var(--deep-blue)"; } 
        else if (currentHeat < 75) { text = "🌤️ 正在接近"; color = "var(--dirt-brown)"; } 
        else { text = "🔥 發現遺跡！"; color = "var(--relic-red)"; }
        ui.feedback.innerText = text; ui.feedback.style.color = color;
    }

    function stopScan() {
        if (bluetoothDevice && bluetoothDevice.watchingAdvertisements) { bluetoothDevice.unwatchAdvertisements(); }
        isScanning = false; toggleButtons(false); updateStatus("任務中斷", false);
        ui.feedback.innerText = "等待指令"; ui.feedback.style.color = "var(--dirt-brown)";
        clearTimeout(watchdogTimer); currentHeat = 0;
    }

    function resetWatchdog() {
        clearTimeout(watchdogTimer);
        watchdogTimer = setTimeout(() => {
            if(isScanning) {
                ui.feedback.innerText = "❓ 訊號丟失"; ui.feedback.style.color = "var(--dirt-brown)";
                ui.rssi.innerText = "---"; ui.heatBar.style.width = "0%";
                currentHeat = 0; log("> 警告：目標訊號消失");
            }
        }, CONFIG.LOST_TIMEOUT);
    }

    function updateStatus(msg, active) { ui.badge.innerText = msg; active ? ui.badge.classList.add('active') : ui.badge.classList.remove('active'); }
    function toggleButtons(running) {
        if (running) { ui.btnStart.classList.add('hidden'); ui.btnStop.classList.remove('hidden'); ui.btnRescan.classList.remove('hidden'); } 
        else { ui.btnStart.classList.remove('hidden'); ui.btnStop.classList.add('hidden'); ui.btnRescan.classList.add('hidden'); }
    }
    function log(msg) { ui.log.innerHTML += `> ${msg}<br>`; ui.log.scrollTop = ui.log.scrollHeight; }

    function setCloseLimit() {
        if(smoothedRssi > -100) { CONFIG.RSSI_HOT = Math.round(smoothedRssi); alert(`已設定最近 (Hot): ${CONFIG.RSSI_HOT}`); } 
        else { alert("請先啟動掃描！"); }
    }
    function setFarLimit() {
        if(smoothedRssi > -100) { CONFIG.RSSI_COLD = Math.round(smoothedRssi); alert(`已設定最遠 (Cold): ${CONFIG.RSSI_COLD}`); } 
        else { alert("請先啟動掃描！"); }
    }

    ui.btnStart.addEventListener('click', startScan);
    ui.btnStop.addEventListener('click', stopScan);
    ui.btnRescan.addEventListener('click', () => { stopScan(); setTimeout(startScan, 500); });
    document.getElementById('btnSound').addEventListener('click', () => AudioEngine.toggleMute());

</script>
</body>
</html>
