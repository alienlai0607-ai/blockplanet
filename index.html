<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#5a4632">

    <title>時空遺跡探測儀 (音效版)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Special+Elite&display=swap" rel="stylesheet">
    
    <style>
        /* ================= CSS 樣式區 (維持考古風格) ================= */
        :root {
            --sand-bg: #f4e4bc;
            --parchment-light: #fdf6e3;
            --dirt-brown: #5a4632;
            --ancient-gold: #d4af37;
            --relic-red: #c0392b;
            --deep-blue: #2c3e50;
            --brass-border: #b58e46;
        }

        body {
            font-family: 'Special Elite', 'Courier New', monospace;
            background-color: var(--sand-bg);
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7z' fill='%238c6239' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
            color: var(--dirt-brown);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 3px double var(--brass-border);
            padding-bottom: 15px;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            font-family: 'Cinzel Decorative', cursive;
            margin: 0;
            font-size: 1.6rem;
            color: var(--dirt-brown);
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--brass-border);
            font-weight: bold;
        }

        .dashboard {
            background: var(--parchment-light);
            border: 4px solid var(--brass-border);
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(90, 70, 50, 0.5), 0 5px 15px rgba(0,0,0,0.3);
            padding: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        .dashboard::before, .dashboard::after {
            content: "•";
            position: absolute;
            color: var(--brass-border);
            font-size: 2rem;
            line-height: 0;
            top: 15px;
        }
        .dashboard::before { left: 15px; }
        .dashboard::after { right: 15px; }

        .status-badge {
            display: inline-block;
            background: var(--sand-bg);
            border: 2px dashed var(--brass-border);
            color: var(--dirt-brown);
            padding: 5px 15px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .status-badge.active {
            border-style: solid;
            background: var(--ancient-gold);
            animation: pulse-gold 2s infinite;
        }

        /* 音效開關按鈕 */
        .sound-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: 2px solid var(--dirt-brown);
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dirt-brown);
            transition: all 0.2s;
        }
        .sound-toggle.muted {
            opacity: 0.5;
            background: #ccc;
            border-color: #999;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .metric-box {
            background: var(--parchment-light);
            padding: 10px;
            border-radius: 50%;
            border: 3px solid var(--brass-border);
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .metric-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--dirt-brown);
        }

        .message-box {
            min-height: 50px;
            font-size: 1.3rem;
            font-weight: bold;
            margin: 15px 0;
            font-family: 'Cinzel Decorative', cursive;
            color: var(--dirt-brown);
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid rgba(90, 70, 50, 0.2);
            border-bottom: 1px solid rgba(90, 70, 50, 0.2);
            padding: 10px 0;
        }

        .progress-track {
            background: #443322;
            height: 25px;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid var(--brass-border);
            position: relative;
            margin-bottom: 25px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--deep-blue), var(--ancient-gold), var(--relic-red));
            transition: width 0.3s ease-out;
            border-right: 2px solid #fff;
        }

        .btn-main {
            background: var(--dirt-brown);
            color: var(--parchment-light);
            border: 3px solid var(--brass-border);
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Special Elite', cursive;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 0 #3a2c1f;
        }
        .btn-main:active { transform: translateY(3px); box-shadow: 0 1px 0 #3a2c1f; }
        .btn-stop { background: var(--relic-red); margin-top: 10px; box-shadow: 0 4px 0 #8a291f; }

        .calibration-area {
            margin-top: 20px;
            border: 1px dotted var(--dirt-brown);
            padding: 8px;
            border-radius: 10px;
            background: rgba(0,0,0,0.05);
            font-size: 0.75rem;
        }
        .cal-btn-group { display: flex; gap: 5px; margin-top: 5px; }
        .btn-cal { background: var(--deep-blue); color: white; border: none; padding: 5px; border-radius: 4px; font-size: 0.7rem; flex: 1; }

        #log {
            background: var(--parchment-light);
            color: var(--dirt-brown);
            font-size: 0.7rem;
            padding: 10px;
            width: 90%;
            max-width: 400px;
            height: 80px;
            overflow-y: auto;
            border: 2px dashed var(--brass-border);
            margin-top: 20px;
            text-align: left;
            opacity: 0.8;
        }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<header>
    <h1>時空遺跡探測儀</h1>
    <div class="subtitle">音效回饋系統 V3.0</div>
</header>

<div class="dashboard">
    <button id="btnSound" class="sound-toggle" title="切換音效">🔊</button>

    <div id="statusBadge" class="status-badge">儀器準備就緒</div>

    <div class="metrics-grid">
        <div class="metric-box">
            <div class="metric-label">訊號 RSSI</div>
            <div class="metric-value" id="rssiValue">---</div>
        </div>
        <div class="metric-box">
            <div class="metric-label">共鳴深度</div>
            <div style="display:flex; align-items:baseline;">
                <div class="metric-value" id="heatValue">0</div>
                <span style="font-size:1rem;">%</span>
            </div>
        </div>
    </div>

    <div class="message-box" id="mainFeedback">等待啟動...</div>

    <div class="heat-container">
        <div class="progress-track">
            <div class="progress-fill" id="heatBar"></div>
        </div>
    </div>

    <div id="controls">
        <button id="btnStart" class="btn-main">啟動探測器 (含音效)</button>
        <button id="btnStop" class="btn-main btn-stop hidden">中斷任務</button>
        <button id="btnRescan" class="btn-main btn-stop hidden">重新校準</button>
    </div>
</div>

<div class="calibration-area">
    <div style="font-weight:bold;">🔧 工程校正 (Calibration)</div>
    <div class="cal-btn-group">
        <button class="btn-cal" onclick="setCloseLimit()">設為最近 (Hot)</button>
        <button class="btn-cal" onclick="setFarLimit()">設為最遠 (Cold)</button>
    </div>
</div>

<div id="log">> 系統初始化完成。<br>> 點擊右上方喇叭可靜音。</div>

<script>
    // === 1. 設定與參數 ===
    const CONFIG = {
        RSSI_COLD: -95,
        RSSI_HOT: -50, 
        SMOOTHING_FACTOR: 0.1, 
        LOST_TIMEOUT: 3000
    };

    let bluetoothDevice;
    let smoothedRssi = -100;
    let currentHeat = 0; // 全域變數，供音效系統讀取
    let watchdogTimer;
    let isScanning = false;

    // === 2. 音效系統 (Audio Engine) ===
    const AudioEngine = {
        ctx: null,
        isMuted: false,
        nextBeepTime: 0,
        timerId: null,

        init: function() {
            // 初始化音效環境 (瀏覽器要求必須在使用者點擊後才能啟動)
            if (!this.ctx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            }
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
            this.startScheduler();
        },

        playBeep: function(freq, duration) {
            if (this.isMuted || !this.ctx) return;
            
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sine'; // 正弦波 (聽起來像聲納/雷達)
            osc.frequency.value = freq;
            
            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start();
            // 聲音淡出，避免爆音
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
            osc.stop(this.ctx.currentTime + duration);
        },

        toggleMute: function() {
            this.isMuted = !this.isMuted;
            const btn = document.getElementById('btnSound');
            if(this.isMuted) {
                btn.classList.add('muted');
                btn.innerText = '🔇';
            } else {
                btn.classList.remove('muted');
                btn.innerText = '🔊';
                // 測試音
                if(this.ctx) this.playBeep(600, 0.1);
            }
        },

        startScheduler: function() {
            // 這裡使用遞迴的 setTimeout 來控制嗶嗶聲的節奏
            const schedule = () => {
                if (isScanning && currentHeat > 0) {
                    // === 聲音演算法 (重要工程點) ===
                    // 1. 頻率 (Pitch): 熱度越高，音調越高 (400Hz ~ 1200Hz)
                    const pitch = 400 + (currentHeat * 8); 
                    
                    // 2. 間隔 (Interval): 熱度越高，嗶得越快 (1200ms ~ 100ms)
                    // 使用 Math.max 確保最快不超過 80ms
                    let interval = 1200 - (currentHeat * 11);
                    interval = Math.max(80, interval);

                    this.playBeep(pitch, 0.1);
                    
                    this.timerId = setTimeout(schedule, interval);
                } else {
                    // 如果沒在掃描或訊號太弱，就慢點檢查
                    this.timerId = setTimeout(schedule, 500);
                }
            };
            schedule();
        },
        
        stop: function() {
            if(this.timerId) clearTimeout(this.timerId);
        }
    };

    // === 3. UI 元素 ===
    const ui = {
        badge: document.getElementById('statusBadge'),
        feedback: document.getElementById('mainFeedback'),
        rssi: document.getElementById('rssiValue'),
        heatVal: document.getElementById('heatValue'),
        heatBar: document.getElementById('heatBar'),
        btnStart: document.getElementById('btnStart'),
        btnStop: document.getElementById('btnStop'),
        btnRescan: document.getElementById('btnRescan'),
        log: document.getElementById('log'),
        debugCold: document.getElementById('debugCold'),
        debugHot: document.getElementById('debugHot')
    };

    // === 4. 核心邏輯 ===
    async function startScan() {
        // 啟動音效引擎 (必須在點擊事件中)
        AudioEngine.init();

        if (!navigator.bluetooth) {
            alert("⚠️ 錯誤：您的瀏覽器不支援 Web Bluetooth (請用 Android Chrome)。");
            return;
        }

        try {
            updateStatus("啟動音效與掃描...", true);
            log("> 系統啟動...");
            
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: "BBC micro:bit" }], 
                optionalServices: [] 
            });

            const deviceName = bluetoothDevice.name || "未知目標";
            log(`> 鎖定目標：${deviceName}`);
            updateStatus("訊號鎖定", true);
            
            bluetoothDevice.addEventListener('advertisementreceived', handleAdvertisement);
            await bluetoothDevice.watchAdvertisements();
            
            isScanning = true;
            toggleButtons(true);
            smoothedRssi = -100; 

        } catch (error) {
            if (error.name === 'NotFoundError') {
                 updateStatus("操作取消", false);
            } else {
                 updateStatus("連線錯誤", false);
                 log(`> 錯誤：${error.message}`);
                 if(error.message.includes("watchAdvertisements")) alert("請開啟 Chrome 實驗功能或使用 Android 手機。");
            }
        }
    }

    function handleAdvertisement(event) {
        const rawRssi = event.rssi;
        if (smoothedRssi === -100) {
            smoothedRssi = rawRssi;
        } else {
            smoothedRssi = (CONFIG.SMOOTHING_FACTOR * rawRssi) + 
                           ((1 - CONFIG.SMOOTHING_FACTOR) * smoothedRssi);
        }
        updateUI(rawRssi, smoothedRssi);
        resetWatchdog();
    }

    function updateUI(raw, smooth) {
        let clamped = Math.max(CONFIG.RSSI_COLD, Math.min(smooth, CONFIG.RSSI_HOT));
        let heatPercent = ((clamped - CONFIG.RSSI_COLD) / (CONFIG.RSSI_HOT - CONFIG.RSSI_COLD)) * 100;
        
        // 更新全域變數，讓音效引擎讀取
        currentHeat = Math.round(heatPercent);

        ui.rssi.innerText = Math.round(smooth); 
        ui.heatVal.innerText = currentHeat;
        ui.heatBar.style.width = `${currentHeat}%`;

        let text = "";
        let color = "";
        
        if (currentHeat < 30) {
            text = "❄️ 訊號微弱";
            color = "var(--deep-blue)";
        } else if (currentHeat < 75) {
            text = "🌤️ 正在接近";
            color = "var(--dirt-brown)";
        } else {
            text = "🔥 發現遺跡！";
            color = "var(--relic-red)";
        }

        ui.feedback.innerText = text;
        ui.feedback.style.color = color;
    }

    function stopScan() {
        if (bluetoothDevice && bluetoothDevice.watchingAdvertisements) {
            bluetoothDevice.unwatchAdvertisements(); 
        }
        isScanning = false;
        toggleButtons(false);
        updateStatus("任務中斷", false);
        ui.feedback.innerText = "等待指令";
        ui.feedback.style.color = "var(--dirt-brown)";
        clearTimeout(watchdogTimer);
        currentHeat = 0; // 停止聲音
    }

    function resetWatchdog() {
        clearTimeout(watchdogTimer);
        watchdogTimer = setTimeout(() => {
            if(isScanning) {
                ui.feedback.innerText = "❓ 訊號丟失";
                ui.feedback.style.color = "var(--dirt-brown)";
                ui.rssi.innerText = "---";
                ui.heatBar.style.width = "0%";
                currentHeat = 0; // 停止聲音
                log("> 警告：目標訊號消失");
            }
        }, CONFIG.LOST_TIMEOUT);
    }

    // === 輔助與校正 ===
    function updateStatus(msg, active) {
        ui.badge.innerText = msg;
        active ? ui.badge.classList.add('active') : ui.badge.classList.remove('active');
    }

    function toggleButtons(running) {
        if (running) {
            ui.btnStart.classList.add('hidden');
            ui.btnStop.classList.remove('hidden');
            ui.btnRescan.classList.remove('hidden');
        } else {
            ui.btnStart.classList.remove('hidden');
            ui.btnStop.classList.add('hidden');
            ui.btnRescan.classList.add('hidden');
        }
    }

    function log(msg) {
        ui.log.innerHTML += `> ${msg}<br>`;
        ui.log.scrollTop = ui.log.scrollHeight;
    }

    function setCloseLimit() {
        if(smoothedRssi > -100) {
            CONFIG.RSSI_HOT = Math.round(smoothedRssi);
            alert(`已設定目前位置為「最近」(Hot)\n數值: ${CONFIG.RSSI_HOT}`);
        }
    }
    function setFarLimit() {
        if(smoothedRssi > -100) {
            CONFIG.RSSI_COLD = Math.round(smoothedRssi);
            alert(`已設定目前位置為「最遠」(Cold)\n數值: ${CONFIG.RSSI_COLD}`);
        }
    }

    // 事件綁定
    ui.btnStart.addEventListener('click', startScan);
    ui.btnStop.addEventListener('click', stopScan);
    ui.btnRescan.addEventListener('click', () => { stopScan(); setTimeout(startScan, 500); });
    document.getElementById('btnSound').addEventListener('click', () => AudioEngine.toggleMute());

</script>
</body>
</html>
