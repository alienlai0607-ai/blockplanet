<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>時空遺跡探測儀 (工程校正版)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Special+Elite&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           CSS 樣式表：決定網頁長什麼樣子
           ========================================= */
        
        :root {
            /* 定義全域變數：考古風格配色 */
            --sand-bg: #f4e4bc;       /* 沙漠背景色 */
            --parchment-light: #fdf6e3; /* 羊皮紙亮色 */
            --dirt-brown: #5a4632;    /* 泥土褐 (主色調) */
            --ancient-gold: #d4af37;  /* 古代金 (強調色) */
            --relic-red: #c0392b;     /* 遺跡紅 (熱區/警告) */
            --deep-blue: #2c3e50;     /* 深海藍 (冷區/深層) */
            --brass-border: #b58e46;  /* 黃銅邊框色 */
        }

        body {
            /* 設定主要字體：Special Elite 是類似打字機的字體 */
            font-family: 'Special Elite', 'Courier New', monospace;
            background-color: var(--sand-bg);
            /* 加入 SVG 背景紋路，增加質感 */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7z' fill='%238c6239' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
            color: var(--dirt-brown);
            margin: 0;
            padding: 15px;
            display: flex; /* 使用 Flexbox 排版 */
            flex-direction: column;
            align-items: center; /* 讓所有內容置中 */
            min-height: 100vh;
        }

        /* 標題區域設計 */
        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 3px double var(--brass-border); /* 雙線邊框 */
            padding-bottom: 15px;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            font-family: 'Cinzel Decorative', cursive; /* 標題裝飾字體 */
            margin: 0;
            font-size: 1.8rem;
            color: var(--dirt-brown);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3); /* 文字陰影 */
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--brass-border);
            font-weight: bold;
            margin-top: 5px;
        }

        /* 主儀表板：黃銅儀器風格 */
        .dashboard {
            background: var(--parchment-light);
            border: 4px solid var(--brass-border);
            border-radius: 10px;
            /* 內陰影 + 外陰影，製造立體感 */
            box-shadow: 
                inset 0 0 10px rgba(90, 70, 50, 0.5),
                0 5px 15px rgba(0,0,0,0.3);
            padding: 25px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        /* 裝飾用的四個角落鉚釘 */
        .dashboard::before, .dashboard::after {
            content: "•";
            position: absolute;
            color: var(--brass-border);
            font-size: 2rem;
            line-height: 0;
        }
        .dashboard::before { top: 15px; left: 15px; }
        .dashboard::after { top: 15px; right: 15px; }

        /* 狀態徽章 (頂部的狀態顯示) */
        .status-badge {
            display: inline-block;
            background: var(--sand-bg);
            border: 2px dashed var(--brass-border);
            color: var(--dirt-brown);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 25px;
        }
        /* 當狀態啟動時的特效 */
        .status-badge.active {
            border-style: solid;
            background: var(--ancient-gold);
            animation: pulse-gold 2s infinite; /* 呼吸燈動畫 */
        }

        /* 數據顯示網格 (兩個圓圈) */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-box {
            background: var(--parchment-light);
            padding: 15px;
            border-radius: 50%; /* 強制變成圓形 */
            border: 3px solid var(--brass-border);
            aspect-ratio: 1 / 1; /* 保持正圓比例 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .metric-label {
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--brass-border);
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--dirt-brown);
        }

        /* 中央大字提示區 */
        .message-box {
            min-height: 60px;
            font-size: 1.4rem;
            font-weight: bold;
            margin: 20px 0;
            font-family: 'Cinzel Decorative', cursive;
            color: var(--dirt-brown);
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid rgba(90, 70, 50, 0.2);
            border-bottom: 1px solid rgba(90, 70, 50, 0.2);
            padding: 10px 0;
        }

        /* 探測進度條外框 */
        .progress-track {
            background: #443322;
            height: 28px;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid var(--brass-border);
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        /* 探測進度條內容 (漸層色) */
        .progress-fill {
            height: 100%;
            width: 0%; /* JS 會改變這個寬度 */
            background: linear-gradient(90deg, var(--deep-blue), var(--ancient-gold), var(--relic-red));
            transition: width 0.3s ease-out; /* 寬度變化的動畫 */
            border-right: 2px solid #fff;
        }

        /* 按鈕樣式 */
        .btn-main {
            background: var(--dirt-brown);
            color: var(--parchment-light);
            border: 3px solid var(--brass-border);
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: 'Special Elite', cursive;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 0 #3a2c1f; /* 按鈕立體陰影 */
        }
        .btn-main:active {
            transform: translateY(4px); /* 按下時下沉 */
            box-shadow: 0 1px 0 #3a2c1f;
        }
        .btn-stop {
            background: var(--relic-red); /* 停止按鈕用紅色 */
            box-shadow: 0 5px 0 #8a291f;
            margin-top: 15px;
        }

        /* 現場日誌區域 */
        #log {
            background: var(--parchment-light);
            color: var(--dirt-brown);
            font-size: 0.8rem;
            padding: 15px;
            width: 90%;
            max-width: 400px;
            height: 100px;
            overflow-y: auto;
            border: 2px dashed var(--brass-border);
            margin-top: 25px;
            text-align: left;
            opacity: 0.8;
        }

        /* === 工程校正區 (新功能) === */
        .calibration-area {
            margin-top: 30px;
            border: 1px dotted var(--dirt-brown);
            padding: 10px;
            border-radius: 10px;
            background: rgba(0,0,0,0.05);
            font-size: 0.8rem;
        }
        .cal-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .btn-cal {
            background: var(--deep-blue);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            flex: 1;
        }

        /* 動畫效果定義 */
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<header>
    <h1>時空遺跡探測儀</h1>
    <div class="subtitle">任務代號：尋找失落的 TCAPSULE</div>
</header>

<div class="dashboard">
    <div id="statusBadge" class="status-badge">儀器準備就緒</div>

    <div class="metrics-grid">
        <div class="metric-box">
            <div class="metric-label">訊號強度 (RSSI)</div>
            <div class="metric-value" id="rssiValue">---</div>
        </div>
        <div class="metric-box">
            <div class="metric-label">共鳴深度</div>
            <div style="display:flex; align-items:baseline;">
                <div class="metric-value" id="heatValue">0</div>
                <span style="font-size:1rem;">%</span>
            </div>
        </div>
    </div>

    <div class="message-box" id="mainFeedback">等待啟動探測...</div>

    <div class="heat-container">
        <div style="display:flex; justify-content:space-between; font-size:0.8rem; margin-bottom:5px; font-weight:bold;">
            <span>深層/微弱</span>
            <span>地表/強烈</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="heatBar"></div>
        </div>
    </div>

    <div id="controls">
        <button id="btnStart" class="btn-main">啟動探測器</button>
        <button id="btnStop" class="btn-main btn-stop hidden">中斷任務</button>
        <button id="btnRescan" class="btn-main btn-stop hidden">重新校準儀器</button>
    </div>
</div>

<div class="calibration-area">
    <div style="font-weight:bold; margin-bottom:5px;">🔧 工程校正模式 (Engineering Mode)</div>
    <div class="cal-btn-group">
        <button class="btn-cal" onclick="setCloseLimit()">設定目前為「最近」<br>(Hot Limit)</button>
        <button class="btn-cal" onclick="setFarLimit()">設定目前為「最遠」<br>(Cold Limit)</button>
    </div>
    <div style="margin-top:5px; color:#555;">
        目前設定： 冷 <span id="debugCold">-95</span> ~ 熱 <span id="debugHot">-50</span>
    </div>
</div>

<div id="log">
    > 探險日誌登錄中...<br>
    > 等待操作員指令。
</div>

<script>
    /* =========================================
       JavaScript 程式邏輯區
       ========================================= */

    // === 1. 全域設定 (Configuration) ===
    // 這些是初始參數，可以被下方的校正功能動態修改
    const CONFIG = {
        RSSI_COLD: -95,         // 最遠距離 (數值越小代表越遠)
        RSSI_HOT: -50,          // 最近距離 (數值越大代表越近)
        
        // **關鍵參數**：平滑係數 (Smoothing Factor)
        // 範圍 0.0 ~ 1.0
        // 0.1 = 非常平滑但反應慢 (適合展示，數值穩)
        // 0.9 = 反應快但數值會亂跳
        SMOOTHING_FACTOR: 0.1, 
        
        LOST_TIMEOUT: 3000      // 3秒沒收到訊號就算斷線
    };

    // === 2. 變數宣告 ===
    let bluetoothDevice;        // 存放藍牙裝置物件
    let smoothedRssi = -100;    // 平滑後的 RSSI 值 (預設給最小值)
    let watchdogTimer;          // 斷線計時器
    let isScanning = false;     // 是否正在掃描中

    // === 3. 抓取網頁上的元素 (DOM) ===
    const ui = {
        badge: document.getElementById('statusBadge'),
        feedback: document.getElementById('mainFeedback'),
        rssi: document.getElementById('rssiValue'),
        heatVal: document.getElementById('heatValue'),
        heatBar: document.getElementById('heatBar'),
        btnStart: document.getElementById('btnStart'),
        btnStop: document.getElementById('btnStop'),
        btnRescan: document.getElementById('btnRescan'),
        log: document.getElementById('log'),
        // 校正顯示用
        debugCold: document.getElementById('debugCold'),
        debugHot: document.getElementById('debugHot')
    };

    // === 4. 主要功能：開始掃描 ===
    async function startScan() {
        // 檢查瀏覽器是否支援 Web Bluetooth
        if (!navigator.bluetooth) {
            alert("⚠️ 錯誤：您的瀏覽器不支援 Web Bluetooth。\n請使用 Android 手機的 Chrome 瀏覽器。");
            return;
        }

        try {
            updateStatus("正在掃描區域...", true);
            log("> 啟動廣域掃描 (Searching)...");
            
            // --- 請求藍牙裝置 ---
            // 這裡使用 'namePrefix' (名稱前綴) 來搜尋
            // 只要開頭是 "BBC micro:bit" 的裝置都會被列出來
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: "BBC micro:bit" }], 
                optionalServices: [] // 不需要特定服務，只需要廣播封包
            });

            // 取得裝置名稱
            const deviceName = bluetoothDevice.name || "未知遺跡";
            log(`> 鎖定目標訊號：${deviceName}`);
            updateStatus("已鎖定目標訊號", true);
            
            // --- 開始監聽廣播封包 (Advertisement) ---
            // 當裝置發出訊號時，會觸發 'advertisementreceived' 事件
            bluetoothDevice.addEventListener('advertisementreceived', handleAdvertisement);
            
            // 這一行指令會讓瀏覽器開始持續接收 RSSI 更新
            await bluetoothDevice.watchAdvertisements();
            
            isScanning = true;
            toggleButtons(true); // 切換按鈕狀態
            smoothedRssi = -100; // 重置 RSSI

        } catch (error) {
            // 錯誤處理
            if (error.name === 'NotFoundError') {
                 updateStatus("已取消操作", false);
                 log("> 操作員取消任務。");
            } else {
                 updateStatus("儀器錯誤", false);
                 log(`> 錯誤：${error.message}`);
                 // 針對 Windows 常見錯誤的特別提示
                 if(error.message.includes("watchAdvertisements")) {
                     alert("電腦版 Chrome 可能需開啟實驗功能。\n建議直接使用 Android 手機測試。");
                 }
            }
        }
    }

    // === 5. 核心演算法：處理訊號與平滑化 ===
    function handleAdvertisement(event) {
        // 取得當下瞬間的 RSSI (Raw Data)
        // 這個數值通常很不穩定，會一直跳動
        const rawRssi = event.rssi;
        
        // --- 指數平滑演算法 (Exponential Smoothing) ---
        // 公式：新平滑值 = (係數 * 目前數值) + ((1 - 係數) * 舊平滑值)
        // 這就像是給數據加上避震器，讓變化變得圓滑
        if (smoothedRssi === -100) {
            smoothedRssi = rawRssi; // 第一次直接賦值
        } else {
            smoothedRssi = (CONFIG.SMOOTHING_FACTOR * rawRssi) + 
                           ((1 - CONFIG.SMOOTHING_FACTOR) * smoothedRssi);
        }

        // 更新 UI
        updateUI(rawRssi, smoothedRssi);
        
        // 重置看門狗計時器 (代表還有收到訊號)
        resetWatchdog();
    }

    // === 6. UI 更新邏輯 ===
    function updateUI(raw, smooth) {
        // --- 距離計算 (Mapping) ---
        // 將 RSSI 限制在設定的 Cold ~ Hot 範圍內 (Clamp)
        let clamped = Math.max(CONFIG.RSSI_COLD, Math.min(smooth, CONFIG.RSSI_HOT));
        
        // 將數值轉換成 0 ~ 100 的百分比
        // 公式：(目前值 - 最小值) / (最大值 - 最小值) * 100
        let heatPercent = ((clamped - CONFIG.RSSI_COLD) / (CONFIG.RSSI_HOT - CONFIG.RSSI_COLD)) * 100;
        heatPercent = Math.round(heatPercent);

        // 更新畫面數字
        ui.rssi.innerText = Math.round(smooth); 
        ui.heatVal.innerText = heatPercent;
        ui.heatBar.style.width = `${heatPercent}%`;

        // --- 考古風格的狀態判斷 ---
        let text = "";
        let color = "";
        
        if (heatPercent < 30) {
            text = "❄️ 訊號微弱：位於深層";
            color = "var(--deep-blue)";
        } else if (heatPercent < 75) {
            text = "🌤️ 反應增強：正在接近";
            color = "var(--dirt-brown)";
        } else {
            text = "🔥 發現遺跡：就在腳下！";
            color = "var(--relic-red)";
            // 可選：當非常近時，手機震動一下
            // if (navigator.vibrate) navigator.vibrate(200);
        }

        ui.feedback.innerText = text;
        ui.feedback.style.color = color;
    }

    // === 7. 停止掃描 ===
    function stopScan() {
        if (bluetoothDevice && bluetoothDevice.watchingAdvertisements) {
            bluetoothDevice.unwatchAdvertisements(); // 停止監聽
        }
        isScanning = false;
        toggleButtons(false);
        updateStatus("任務已中斷", false);
        ui.feedback.innerText = "等待指令";
        ui.feedback.style.color = "var(--dirt-brown)";
        clearTimeout(watchdogTimer);
        log("> 連線已終止。");
    }

    // === 8. 看門狗 (Watchdog) - 偵測斷線 ===
    function resetWatchdog() {
        clearTimeout(watchdogTimer);
        // 如果超過設定時間 (3秒) 都沒被重置，代表訊號斷了
        watchdogTimer = setTimeout(() => {
            if(isScanning) {
                ui.feedback.innerText = "❓ 訊號丟失";
                ui.feedback.style.color = "var(--dirt-brown)";
                ui.rssi.innerText = "---";
                ui.heatBar.style.width = "0%";
                log("> 警告：目標訊號消失...");
            }
        }, CONFIG.LOST_TIMEOUT);
    }

    // === 9. 輔助函式 ===
    function updateStatus(msg, active) {
        ui.badge.innerText = msg;
        if(active) {
            ui.badge.classList.add('active'); // 亮燈
        } else {
            ui.badge.classList.remove('active'); // 熄燈
        }
    }

    function toggleButtons(running) {
        // 切換 開始/停止 按鈕的顯示
        if (running) {
            ui.btnStart.classList.add('hidden');
            ui.btnStop.classList.remove('hidden');
            ui.btnRescan.classList.remove('hidden');
        } else {
            ui.btnStart.classList.remove('hidden');
            ui.btnStop.classList.add('hidden');
            ui.btnRescan.classList.add('hidden');
        }
    }

    function log(msg) {
        let now = new Date().toLocaleTimeString('en-GB');
        ui.log.innerHTML += `> [${now}] ${msg}<br>`;
        ui.log.scrollTop = ui.log.scrollHeight; // 自動捲動到底部
    }

    // === 10. 工程校正功能 (Engineering Calibration) ===
    // 這是讓 FLL 學生在現場調整參數用的
    
    function setCloseLimit() {
        // 設定「最近距離」：把當下的 RSSI 設為 RSSI_HOT
        if(smoothedRssi > -100) {
            CONFIG.RSSI_HOT = Math.round(smoothedRssi);
            ui.debugHot.innerText = CONFIG.RSSI_HOT;
            log(`> 校正：設定最近門檻為 ${CONFIG.RSSI_HOT}`);
            alert(`已校正！\n現在這個距離會顯示 100% (熱)`);
        } else {
            alert("請先啟動掃描並接收到訊號後再校正。");
        }
    }

    function setFarLimit() {
        // 設定「最遠距離」：把當下的 RSSI 設為 RSSI_COLD
        if(smoothedRssi > -100) {
            CONFIG.RSSI_COLD = Math.round(smoothedRssi);
            ui.debugCold.innerText = CONFIG.RSSI_COLD;
            log(`> 校正：設定最遠門檻為 ${CONFIG.RSSI_COLD}`);
            alert(`已校正！\n現在這個距離會顯示 0% (冷)`);
        } else {
            alert("請先啟動掃描並接收到訊號後再校正。");
        }
    }

    // === 11. 綁定按鈕事件 ===
    ui.btnStart.addEventListener('click', startScan);
    ui.btnStop.addEventListener('click', stopScan);
    ui.btnRescan.addEventListener('click', () => {
        stopScan();
        setTimeout(startScan, 500);
    });

</script>
</body>
</html>
