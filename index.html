<style>
        /* ================= CSS 樣式區 (FLL 響應式修正版) ================= */
        :root {
            --parchment-light: rgba(253, 246, 227, 0.85); /* 稍微透明，讓背景透出來 */
            --dirt-brown: #5a4632;
            --ancient-gold: #d4af37;
            --relic-red: #c0392b;
            --deep-blue: #2c3e50;
            --brass-border: #b58e46;
        }

        body {
            font-family: 'Special Elite', 'Courier New', monospace;
            color: var(--dirt-brown);
            margin: 0;
            padding: 0; /* 清除預設內距 */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            
            /* === 背景圖設定 (預設電腦版) === */
            background-color: #ffffff; 
            background-image: url('bg.jpg'); 
            background-repeat: no-repeat;
            background-attachment: fixed; /* 背景固定不動 */
            background-position: center bottom; /* 對齊底部中間 */
            background-size: cover; /* 電腦版：填滿整個畫面 */
        }

        /* === 📱 手機版專用修正 (關鍵修改) === */
        @media (max-width: 768px) {
            body {
                /* 手機版：強制讓圖片寬度剛好 100%，高度自動，這樣角色就不會被切掉 */
                background-size: 100% auto; 
                /* 確保圖片黏在螢幕最下方 */
                background-position: center bottom;
                /* 如果圖片上方有留白，用白色填補 */
                background-color: #ffffff; 
            }
            
            /* 讓 UI 不要蓋住下面的公仔，增加底部留白 */
            .dashboard {
                margin-bottom: 40vh !important; /* vh = 螢幕高度的百分比 */
            }
        }

        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.9); 
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid var(--brass-border);
            width: 85%;
            max-width: 450px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10; /* 確保浮在最上層 */
        }

        h1 {
            font-family: 'Cinzel Decorative', cursive;
            margin: 0;
            font-size: 1.5rem; /* 手機字體稍微調小一點 */
            color: var(--dirt-brown);
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--brass-border);
            font-weight: bold;
        }

        .dashboard {
            background: var(--parchment-light);
            border: 3px solid var(--brass-border);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            padding: 20px;
            width: 88%; /* 手機上寬度稍微縮一點 */
            max-width: 400px;
            text-align: center;
            position: relative;
            backdrop-filter: blur(5px);
            z-index: 10;
            
            /* 預設底部留白 (電腦版) */
            margin-bottom: 50px; 
        }

        /* 裝飾鉚釘 */
        .dashboard::before, .dashboard::after {
            content: "•";
            position: absolute;
            color: var(--brass-border);
            font-size: 1.5rem;
            line-height: 0;
            top: 10px;
        }
        .dashboard::before { left: 10px; }
        .dashboard::after { right: 10px; }

        .status-badge {
            display: inline-block;
            background: #fff;
            border: 2px dashed var(--brass-border);
            color: var(--dirt-brown);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .status-badge.active {
            border-style: solid;
            background: var(--ancient-gold);
            animation: pulse-gold 2s infinite;
        }

        .sound-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.6);
            border: 2px solid var(--dirt-brown);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dirt-brown);
        }
        .sound-toggle.muted { opacity: 0.6; background: #ddd; }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .metric-box {
            background: rgba(255,255,255,0.7);
            padding: 8px;
            border-radius: 15px; /* 改成圓角矩形比較省空間 */
            border: 2px solid var(--brass-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .metric-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--dirt-brown);
        }
        
        .metric-label {
            font-size: 0.7rem;
            color: #888;
        }

        .message-box {
            min-height: 40px;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 10px 0;
            font-family: 'Cinzel Decorative', cursive;
            color: var(--dirt-brown);
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid rgba(90, 70, 50, 0.2);
            border-bottom: 1px solid rgba(90, 70, 50, 0.2);
            padding: 8px 0;
        }

        .progress-track {
            background: #443322;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--brass-border);
            position: relative;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--deep-blue), var(--ancient-gold), var(--relic-red));
            transition: width 0.3s ease-out;
            border-right: 2px solid #fff;
        }

        .btn-main {
            background: var(--dirt-brown);
            color: #fff;
            border: 2px solid var(--brass-border);
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Special Elite', cursive;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 0 #3a2c1f;
        }
        .btn-main:active { transform: translateY(3px); box-shadow: 0 1px 0 #3a2c1f; }
        .btn-stop { background: var(--relic-red); margin-top: 10px; box-shadow: 0 4px 0 #8a291f; }

        .calibration-area {
            margin-top: 15px;
            border: 1px dotted var(--dirt-brown);
            padding: 5px;
            border-radius: 8px;
            background: rgba(255,255,255,0.8);
            font-size: 0.7rem;
        }
        .cal-btn-group { display: flex; gap: 5px; margin-top: 5px; }
        .btn-cal { background: var(--deep-blue); color: white; border: none; padding: 6px; border-radius: 4px; font-size: 0.7rem; flex: 1; }

        #log {
            background: rgba(255,255,255,0.9);
            color: var(--dirt-brown);
            font-size: 0.7rem;
            padding: 10px;
            width: 88%;
            max-width: 400px;
            height: 60px; /* Log 縮短一點 */
            overflow-y: auto;
            border: 2px dashed var(--brass-border);
            margin-top: 15px;
            text-align: left;
            border-radius: 5px;
            
            /* 在手機上不需要這個留白了，因為我們用 margin-bottom 控制了 Dashboard */
            display: block; 
        }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        .hidden { display: none; }
    </style>
