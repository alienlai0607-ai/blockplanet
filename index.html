<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2822/2822306.png">
    <link rel="icon" sizes="192x192" href="https://cdn-icons-png.flaticon.com/512/2822/2822306.png">

    <title>時空遺跡探測儀</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Special+Elite&display=swap" rel="stylesheet">
    
    <style>
        /* ================= CSS 樣式區 ================= */
        :root {
            --parchment-light: rgba(253, 246, 227, 0.95); 
            --dirt-brown: #5a4632;
            --ancient-gold: #d4af37;
            --relic-red: #c0392b;
            --deep-blue: #2c3e50;
            --brass-border: #b58e46;
        }

        body {
            font-family: 'Special Elite', 'Courier New', monospace;
            color: var(--dirt-brown);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #ffffff;
            /* 背景圖我們交給獨立的圖層處理，這裡保持乾淨 */
        }

        /* === 關鍵：獨立背景圖層 (Layer -1) === */
        #bg-layer {
            position: fixed; /* 固定在視窗，不隨捲動移動 */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* 放在最底層 */
            
            background-image: url('bg.jpg'); /* 讀取圖片 */
            background-repeat: no-repeat;
            
            /* --- 手機版預設設定 (Mobile First) --- */
            /* cover: 強制填滿螢幕，不留白邊 (可能會切掉一點左右，但保證滿版) */
            background-size: cover; 
            /* center bottom: 重點是對齊底部，確保公仔一定看得到 */
            background-position: center bottom; 
        }

        /* === 電腦/平板版 響應式修正 (大於 768px 時) === */
        @media (min-width: 768px) {
            #bg-layer {
                /* contain: 完整顯示整張圖片的比例，絕不裁切 (左右可能會留白) */
                background-size: contain;
                background-position: center bottom;
                background-color: #f0f0f0; /* 留白處的底色 */
            }
        }

        /* === 內容層 (Layer 1) === */
        #content-layer {
            position: relative;
            z-index: 10; /* 浮在背景上面 */
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            
            /* 底部留白：讓使用者可以往下滑，看到完整的公仔 */
            padding-bottom: 35vh; 
        }

        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.95); 
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid var(--brass-border);
            width: 85%;
            max-width: 450px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            font-family: 'Cinzel Decorative', cursive;
            margin: 0;
            font-size: 1.4rem;
            color: var(--dirt-brown);
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--brass-border);
            font-weight: bold;
        }

        /* 儀表板 */
        .dashboard {
            background: var(--parchment-light);
            border: 3px solid var(--brass-border);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            padding: 15px;
            width: 85%; /* 稍微縮窄一點，避免太貼邊 */
            max-width: 380px;
            text-align: center;
            position: relative;
            margin-bottom: 20px;
        }

        /* 裝飾鉚釘 */
        .dashboard::before, .dashboard::after {
            content: "•";
            position: absolute;
            color: var(--brass-border);
            font-size: 1.5rem;
            line-height: 0;
            top: 10px;
        }
        .dashboard::before { left: 10px; }
        .dashboard::after { right: 10px; }

        .status-badge {
            display: inline-block;
            background: #fff;
            border: 2px dashed var(--brass-border);
            color: var(--dirt-brown);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .status-badge.active {
            border-style: solid;
            background: var(--ancient-gold);
            animation: pulse-gold 2s infinite;
        }

        /* 音效開關 */
        .sound-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.6);
            border: 2px solid var(--dirt-brown);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dirt-brown);
        }
        .sound-toggle.muted { opacity: 0.6; background: #ddd; }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .metric-box {
            background: rgba(255,255,255,0.7);
            padding: 8px;
            border-radius: 15px;
            border: 2px solid var(--brass-border
